title: "AnIskill AI實戰誌"
description: "由 IT 顧問 Eric Chan 主理：親身實測的 AI 工具、UI 設計、前端開發與科技知識分享。試過先講。"
author: "Eric Chan"
email: "" 
baseurl: ""
url: "https://aniskill.esgov.org"
timezone: "Asia/Taipei"

# GitHub Pages 相容設定
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

permalink: /:categories/:year/:month/:day/:title:output_ext

paginate: 10
paginate_path: "/page/:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Eric Chan"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
