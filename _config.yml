title: "UiSkills"
description: "由 IT 顧問 Eva Chan 主理：親身實測嘅 UI 設計、前端開發、AI 工具與科技知識分享。試過先講。"
author: "Eva Chan"
email: "" 
baseurl: "/blog"
url: "https://hongkpng855-lang.github.io"
timezone: "Asia/Taipei"

# GitHub Pages 相容設定
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

permalink: /:categories/:year/:month/:day/:title:output_ext

paginate: 10
paginate_path: "/page/:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Eva Chan"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
